project:
  type: book
  output-dir: _book

book:
  title: "AI/ML Learning Notes"
  subtitle: "From Foundations to Frontier AI"
  author: "Venkataramana Miryala, PhD"
  date: today
  page-navigation: true
  search: true
  repo-url: https://github.com/ramana-analytics/ramana-analytics.github.io
  downloads: [pdf, epub]
  sharing: [twitter, linkedin]
  chapters:
    - index.qmd
    - part: "GenAI & Foundation Models"
      chapters:
        # One line per .qmd file in chapters/genai/, in reading order.
        - chapters/genai/index.qmd
        - chapters/genai/llm-foundations.qmd
        # - chapters/genai/prompt-engineering.qmd      ← uncomment when written
        # - chapters/genai/fine-tuning.qmd
        # - chapters/genai/rag.qmd
        # - chapters/genai/agents.qmd
        # - chapters/genai/safety-guardrails.qmd
        # - chapters/genai/evaluation.qmd
    - part: "NLP"
      chapters:
        - chapters/nlp/index.qmd
    - part: "Recommender Systems"
      chapters:
        - chapters/recommenders/index.qmd
    - part: "Computer Vision"
      chapters:
        - chapters/cv/index.qmd
    - part: "Graph Machine Learning"
      chapters:
        - chapters/graph-ml/index.qmd
    - part: "Time-Series & Sequential Modeling"
      chapters:
        - chapters/time-series/index.qmd
    - part: "MLOps & Production AI"
      chapters:
        - chapters/mlops/index.qmd
    - part: "ML System Design"
      chapters:
        - chapters/system-design/index.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: cosmo
      dark: slate
    css: assets/book.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-fold: true
    code-tools: true
    highlight-style: github
  pdf:
    documentclass: scrreprt
    papersize: letter
    fontsize: 11pt
    number-sections: true
    colorlinks: true
    linkcolor: "NavyBlue"
    urlcolor: "NavyBlue"
    citecolor: "NavyBlue"
    geometry:
      - margin=1in
    # Custom macros live in _macros.qmd (included in every chapter), so they
    # work for HTML, PDF, and EPUB — do not redefine them here.
  epub:
    toc-title: "Contents"

editor: source
